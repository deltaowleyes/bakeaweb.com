# BAKE Host: deploys the Cloudflare Worker that serves free sites (pagename.rezsite.com, pagename.bakedby.me,
# bakedbya.pro/pagename/) and sets up their DNS. Runs when host/ changes, or by hand (Actions → BAKE Host → Run workflow).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see host/README.md).
# Optional: BAKE_COUNT_KEY switches on visitor stats (host/count.js, host/stats.sql).
# Also deploys bake-pay, the Email Worker for leah@rezsite.com that publishes sites paid by e-Transfer (pay/README.md).
name: BAKE Host
on:
  push:
    branches: [main]
    paths: ['host/**', 'pay/worker/**', '.github/workflows/host.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: host
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAKE_COUNT_KEY: ${{ secrets.BAKE_COUNT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the secrets are there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set yet, so nothing was deployed. See host/README.md."; exit 0; fi
          echo "ok=1" >> "$GITHUB_ENV"
      - name: Set up DNS (wildcards, proxy, SSL)
        if: env.ok == '1'
        run: node setup-dns.mjs
      - name: Deploy the Worker
        if: env.ok == '1'
        run: npx --yes wrangler@4 deploy
      - name: Switch on visitor stats (count key)
        if: env.ok == '1'
        run: |
          if [ -z "$BAKE_COUNT_KEY" ]; then echo "::warning::BAKE_COUNT_KEY is not set, so page views are not counted yet."; exit 0; fi
          printf '%s' "$BAKE_COUNT_KEY" | npx --yes wrangler@4 secret put BAKE_COUNT_KEY
      - name: Deploy bake-pay (e-Transfer email Worker)
        if: env.ok == '1'
        working-directory: pay/worker
        run: npx --yes wrangler@4 deploy
      - name: Send leah@rezsite.com to bake-pay
        if: env.ok == '1'
        working-directory: pay/worker
        run: node setup-route.mjs
