# BAKE photo robot: downloads free sample photos from Pixabay for the studio's starter sites and templates.
# Run it from the repo's Actions tab → "Photo robot" → Run workflow (or Claude runs it).
# Needs the secret PIXABAY_API_KEY (Settings → Secrets and variables → Actions).
# It saves the photos and studio/src/lib/photos.json (with credits) to main; the next publish puts them on bakeaweb.com.
name: Photo robot
on:
  workflow_dispatch:
    inputs:
      kinds:
        description: 'Kinds of business, separated by commas (cafe, trades, crafts, salon, fitness, community)'
        default: 'cafe,trades,crafts'
        required: false
      mode:
        description: 'replace = new set of photos; add = keep the picked photos and add the extra topics'
        default: 'replace'
        required: false
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download photos from Pixabay
        working-directory: studio
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node scripts/fetch-photos.mjs "${{ inputs.kinds }}" "${{ inputs.mode }}"
      - name: Save them to the repository
        run: |
          git config user.name "BAKE photo robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/public/photos studio/src/lib/photos.json
          git diff --cached --quiet && echo "No new photos." && exit 0
          git commit -m "Photo robot: sample photos from Pixabay (${{ inputs.kinds }}, ${{ inputs.mode }})"
          git push
