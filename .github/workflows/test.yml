# BAKE Studio testing robot on GitHub Actions.
# Runs every test (studio/tests/) on every push and pull request. Results: the repo's Actions tab.
name: Testing robot
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test the source
        run: npm test
      - name: Test the finished build (only on main, the published branch)
        if: github.ref == 'refs/heads/main'
        run: npx vite build && BAKE_TEST_BUILT=1 npm test
      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            studio/tests/.report
            studio/tests/.results
          retention-days: 14
