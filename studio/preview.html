<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your free website preview · BAKE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232f5d62%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EB%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f1;--ink:#1d2a2c;--mute:#5d6b6d;--line:#d9ddd8;--acc:#2f5d62;--card:#fff;--good:#1f7a4a;--warn:#a8481f;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.02em}header small{opacity:.75}
main{max-width:1240px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:clamp(26px,4vw,40px);line-height:1.15;margin:6px 0 8px}
.lead{color:var(--mute);margin:0 0 18px;max-width:760px}
.score{display:inline-flex;gap:8px;align-items:center;font-weight:700;background:#eef3f1;border-radius:999px;padding:6px 14px}
.score{flex-wrap:wrap}.score span{white-space:nowrap}.score .b{color:var(--warn)}.score .a{color:var(--good)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:22px 0 12px}
.tabs,.dev{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:9px 16px;background:#fff;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc);cursor:pointer;text-decoration:none;display:inline-block}
button[aria-pressed=true],.primary{background:var(--acc);color:#fff}
.stage{background:#e9ebe7;border-radius:18px;padding:14px;overflow:hidden}
.frame{margin:0 auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px #0002;position:relative}
.frame iframe{border:0;display:block;transform-origin:0 0}
.hint{font-size:13px;color:var(--mute);margin:8px 2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h2{margin:0 0 10px;font-size:20px}
.before img{width:100%;border:1px solid var(--line);border-radius:10px;aspect-ratio:4/3;object-fit:cover;object-position:top;background:#eee;display:block}
ul{padding-left:20px;margin:10px 0 0}li{margin:4px 0}
form{display:grid;gap:10px}
input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.msg{min-height:1.4em;margin:0;font-weight:600}
.ok{color:var(--good)}.err{color:var(--warn)}
.empty{text-align:center;color:var(--mute);padding:80px 0}
footer{text-align:center;color:var(--mute);font-size:13px;padding:30px 0}
footer a{color:var(--acc)}
@media (max-width:820px){.grid{grid-template-columns:1fr}.stage{padding:8px}}
</style>
</head>
<body>
<header><div><b>BAKE</b> <small>Websites baked fresh · bakeaweb.com</small></div><small>Private preview, made just for you</small></header>
<main id="app"><p class="empty">Loading your preview…</p></main>
<footer>Prepared by <a href="https://bakeaweb.com/" target="_blank" rel="noopener">BAKE</a>, an Indigenous-owned web studio. This preview is private: only people with this link can see it.</footer>
<script type="module" src="/src/preview.js"></script>
</body>
</html>
