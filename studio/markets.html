<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BAKE Markets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232f5d62%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f1;--ink:#1d2a2c;--mute:#5d6b6d;--line:#d9ddd8;--acc:#2f5d62;--card:#fff;--warn:#a8481f;--good:#1f7a4a;--gold:#b8860b;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:18px}header small{opacity:.75}
main{max-width:1400px;margin:0 auto;padding:20px 24px 60px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn2{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
header .btn2{color:#fff;box-shadow:inset 0 0 0 1.5px #fff8}
.sm{font-size:13px;padding:5px 10px}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.login{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:12px}
.login input{width:100%}
.msg{color:var(--warn);min-height:1.5em;margin:0}
.note{font-size:13px;color:var(--mute);margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tabs button[aria-pressed=true]{background:var(--acc);color:#fff}.tabs button[aria-pressed=false]{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--acc)}.stat span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#eef3f1;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);position:sticky;top:60px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.mk{cursor:pointer}tr.mk:hover td{background:#f9faf8}
tr.open td{background:#f3f6f4}
.top{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--gold);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tld{font-family:ui-monospace,monospace;font-size:12px;color:var(--mute)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.s-notstarted{background:#eee;color:var(--mute)}.s-searching{background:#fff4d6;color:#8a6200}.s-done{background:#e3f2e9;color:var(--good)}
.d-available{background:#e3f2e9;color:var(--good)}.d-bought{background:var(--acc);color:#fff}.d-taken,.d-skip{background:#eee;color:var(--mute)}.d-premium,.d-forsale{background:#fff4d6;color:#8a6200}.d-idea{background:#eef0fb;color:#3c4a9a}
.star{background:none;color:#c9c9c9;font-size:20px;padding:0 4px;line-height:1}.star.on{color:var(--gold)}
.sub{padding:6px 0 10px}.sub table{border:0}.sub td{border:0;padding:4px 8px}
.batches{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.batch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.batch h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.batch ol{margin:0;padding-left:22px;font-size:14px;color:var(--ink)}
.batch .row{display:flex;gap:8px;flex-wrap:wrap}
.how{background:#eef3f1;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.how p{margin:.3em 0}
.add{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.empty{text-align:center;color:var(--mute);padding:60px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:800px){th{position:static}.hide-s{display:none}}
</style>
</head>
<body>
<header><div><b>BAKE Markets</b> <small>future markets and domains · admins only</small></div><div id="who"></div></header>
<main id="app"><p class="empty">Loading…</p></main>
<div class="toast" id="toast"></div>
<script type="module" src="/src/markets.js"></script>
</body>
</html>
